name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20
          ls "$ANDROID_HOME/build-tools" | tail -20
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon lintDebug
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"

          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='com.faselhd.restored' versionCode='1' versionName='0.1.0-restore'" <<<"$BADGING"
          grep -q "sdkVersion:'23'" <<<"$BADGING"
          grep -q "targetSdkVersion:'35'" <<<"$BADGING"

          PERMISSIONS="$($AAPT dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          grep -q "android.permission.INTERNET" <<<"$PERMISSIONS"
          grep -q "android.permission.ACCESS_NETWORK_STATE" <<<"$PERMISSIONS"
          if grep -Eiq 'android.permission.(READ_CONTACTS|WRITE_CONTACTS|READ_SMS|SEND_SMS|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CALL_LOG|WRITE_CALL_LOG|CALL_PHONE|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW)' <<<"$PERMISSIONS"; then
            echo "Unexpected sensitive permission detected in built APK" >&2
            exit 1
          fi

          MANIFEST_TREE="$($AAPT dump xmltree "$APK" AndroidManifest.xml)"
          grep -q 'android:usesCleartextTraffic(0x010104ec)=\(type 0x12\)0x0' <<<"$MANIFEST_TREE"
          grep -q 'E: activity' <<<"$MANIFEST_TREE"
          grep -q 'com.faselhd.restored.ui.PlayerActivity' <<<"$MANIFEST_TREE"
          grep -q 'com.faselhd.restored.ui.MainActivity' <<<"$MANIFEST_TREE"

          unzip -t "$APK"
          sha256sum "$APK"
          if unzip -p "$APK" | strings | grep -Eiq '(YOUR_API_KEY|REPLACE_ME|Bearer[[:space:]]+[A-Za-z0-9._~-]{20,}|api[_-]?key[=:][[:space:]]*[A-Za-z0-9._~-]{12,}|password[=:][[:space:]]*[^[:space:]]{8,})'; then
            echo "Potential placeholder or embedded credential detected anywhere in APK payload" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fasel-hd-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator end-to-end smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Preserve runtime smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
